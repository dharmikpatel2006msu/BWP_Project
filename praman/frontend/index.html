<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — P.R.A.M.A.N Digital Evidence Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">🛡️</div>
      <h1 class="login-title">P.R.A.M.A.N</h1>
      <p class="login-subtitle">Portal for Recording and Managing Authentic Nodes</p>
      <p class="login-disclaimer">Digital Evidence Management & Cryptographic Chain of Custody System</p>
    </div>

    <div id="login-error-alert" class="alert alert-danger" style="display: none;"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Authorized Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="officer@praman.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Access Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 6px;">
        Secure System Access
      </button>
    </form>

    <div class="demo-credentials-box">
      <h4>Demo Credentials (One-Click Autofill)</h4>
      <div class="demo-btn-row">
        <button type="button" class="btn-fill-cred" onclick="autofillCred('admin@praman.com', 'Admin@123')">Admin</button>
        <button type="button" class="btn-fill-cred" onclick="autofillCred('investigator@praman.com', 'Investigator@123')">Investigator</button>
        <button type="button" class="btn-fill-cred" onclick="autofillCred('forensic@praman.com', 'Forensic@123')">Forensic</button>
        <button type="button" class="btn-fill-cred" onclick="autofillCred('court@praman.com', 'Court@123')">Court Officer</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function performLogin(email, password) {
      const submitBtn = document.getElementById('btn-login-submit');
      const errorAlert = document.getElementById('login-error-alert');
      errorAlert.style.display = 'none';

      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating & Accessing Inner System...';

      try {
        const res = await api.post('/auth/login', { email, password });
        if (res && res.data) {
          localStorage.setItem('praman_token', res.data.token);
          localStorage.setItem('praman_user', JSON.stringify(res.data.user));
          
          if (res.data.user.role === 'court_officer') {
            window.location.href = 'court-dashboard.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }
      } catch (err) {
        errorAlert.textContent = err.message || 'Authentication failed. Please verify credentials.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Secure System Access';
      }
    }

    function autofillCred(email, pass) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
      // Instantly log in so clicking the role enters directly into the inner part!
      performLogin(email, pass);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to inner dashboard
      const token = localStorage.getItem('praman_token');
      const user = getUser();
      if (token && user) {
        if (user.role === 'court_officer') {
          window.location.href = 'court-dashboard.html';
        } else {
          window.location.href = 'dashboard.html';
        }
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('error') === 'session_expired') {
        const alertBox = document.getElementById('login-error-alert');
        alertBox.textContent = 'Your session has expired. Please log in again.';
        alertBox.style.display = 'block';
      }

      const form = document.getElementById('login-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        performLogin(email, password);
      });
    });
  </script>
</body>
</html>
